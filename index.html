<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ordinary archive</title>
  <meta name="description" content="things I don't want to forget.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f4f0e8;
      --ink: #25231f;
      --muted: #77736b;
      --line: #d8d1c5;
      --accent: #65745d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0 0;
      border-bottom: 1px solid var(--line);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-family: "DM Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    nav a:hover {
      color: var(--ink);
    }

    .hero {
      padding: 110px 0 100px;
      max-width: 900px;
    }

    .eyebrow {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 28px;
      font-family: "Libre Baskerville", serif;
      font-size: clamp(42px, 7vw, 76px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .hero p {
      max-width: 720px;
      margin: 0;
      font-size: 15px;
      color: #514d46;
    }

    .date {
      margin-top: 36px;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .now {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 26px 0;
      margin-bottom: 100px;
    }

    .section {
      padding: 0 0 110px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 38px;
    }

    .section-number {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
    }

    h2 {
      margin: 0;
      font-family: "Libre Baskerville", serif;
      font-size: 26px;
      font-weight: 400;
    }

    .section-description {
      margin-top: 5px;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .card {
      background: var(--paper);
      padding: 30px;
      min-height: 210px;
    }

    .card:hover {
      background: #f7f3ec;
    }

    .meta {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-family: "Libre Baskerville", serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.5;
    }

    .card p {
      margin: 0;
      font-size: 14px;
      color: #555149;
    }

    .reading-card {
      cursor: pointer;
    }

    .open-note {
      display: inline-block;
      margin-top: 25px;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .days {
      border-top: 1px solid var(--line);
    }

    .day {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 40px;
      padding: 32px 0;
      border-bottom: 1px solid var(--line);
    }

    .day-date {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .day h3 {
      margin: 0 0 10px;
      font-family: "Libre Baskerville", serif;
      font-size: 19px;
      font-weight: 400;
    }

    .day p {
      margin: 0;
      max-width: 700px;
      font-size: 14px;
      color: #555149;
    }

    .places {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .place {
      background: var(--paper);
      padding: 30px;
      min-height: 180px;
    }

    .place:hover {
      background: #f7f3ec;
    }

    .place .meta {
      margin-bottom: 20px;
    }

    .place h3 {
      margin: 0 0 10px;
      font-family: "Libre Baskerville", serif;
      font-size: 21px;
      font-weight: 400;
    }

    .place p {
      margin: 0;
      font-size: 13px;
      color: #555149;
    }

    .words {
      border-top: 1px solid var(--line);
    }

    .word {
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
    }

    .word-number {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .word p {
      margin: 0;
      font-family: "Libre Baskerville", serif;
      font-size: 21px;
      line-height: 1.7;
    }

    .thoughts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 0 45px;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(37, 35, 31, 0.45);
      z-index: 1000;
      padding: 30px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--paper);
      padding: 45px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 22px;
      border: 0;
      background: none;
      font-family: "DM Mono", monospace;
      font-size: 18px;
      cursor
